name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Check Android SDK
        run: echo "ANDROID_HOME=$ANDROID_HOME" && ls "$ANDROID_HOME/platforms" | tail -3

      - name: Install and build web assets
        run: |
          npm ci
          node build-web.mjs
          npx cap sync android

      - name: Restore signing key
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > android/app/release.jks
            echo "SIGNED=1" >> "$GITHUB_ENV"
          else
            echo "No signing key secret; building a debug APK instead."
          fi

      - name: Check signing key
        if: env.SIGNED == '1'
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          echo "Keystore file: $(wc -c < android/app/release.jks) bytes, sha256 $(sha256sum android/app/release.jks | cut -c1-16)"
          echo "Password length: ${#KEYSTORE_PASSWORD} characters"
          if keytool -list -keystore android/app/release.jks -storepass "$KEYSTORE_PASSWORD" >/dev/null 2>&1; then
            echo "KEYSTORE CHECK: password OK"
            keytool -list -keystore android/app/release.jks -storepass "$KEYSTORE_PASSWORD" | grep -i "fingerprint\|paramis"
          else
            echo "KEYSTORE CHECK: FAILED - password does not open this keystore (or keystore text is incomplete)"
            exit 1
          fi

      - name: Build APK
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: paramis
          BAZAAR_RSA_KEY: ${{ secrets.BAZAAR_RSA_KEY }}
        run: |
          chmod +x gradlew
          if [ "$SIGNED" = "1" ]; then
            ./gradlew --no-daemon assembleRelease
            cp app/build/outputs/apk/release/app-release.apk ../Masir-1.0.${VERSION_CODE}.apk
          else
            ./gradlew --no-daemon assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk ../Masir-1.0.${VERSION_CODE}-debug.apk
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: Masir-apk
          path: Masir-*.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Masir 1.0.${{ github.run_number }}
          body: |
            مسیر · برنامه‌ریز مطالعه — نسخه‌ی 1.0.${{ github.run_number }}
            فایل APK زیر را روی گوشی اندروید دانلود و نصب کنید.
          files: Masir-*.apk
